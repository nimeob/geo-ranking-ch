version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_DEBUG=True
      - GEO_ADMIN_BASE_URL=https://api3.geo.admin.ch/rest/services
      - API_KEY_HEADER=X-API-Key
      - DATABASE_URL=postgresql://geo:geo123@postgres:5432/geo_ranking
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    command: >
      sh -c "pip install -r requirements-dev.txt &&
             uvicorn src.api.web_service.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional: Postgres für Async-Jobs
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-georanking}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_only_change_me}
      - POSTGRES_DB=${POSTGRES_DB:-georanking_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-georanking} -d ${POSTGRES_DB:-georanking_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - georanking_dev_pgdata:/var/lib/postgresql/data

volumes:
  redis_data:
  georanking_dev_pgdata:
