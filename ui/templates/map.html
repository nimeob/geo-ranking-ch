<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karte – geo-ranking-ch</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        #search-box {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            width: 300px;
        }
        #search-box input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
        }
        #results {
            position: absolute;
            top: 50px;
            left: 10px;
            z-index: 1000;
            width: 300px;
            background: white;
            border: 1px solid #ccc;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .result-item:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div id="search-box">
        <input type="text" id="search-input" placeholder="Adresse suchen..." />
        <div id="results"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Karte initialisieren
        const map = L.map('map').setView([46.8, 8.3], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Marker für Suchergebnisse
        let markers = [];

        // Suchfunktion
        document.getElementById('search-input').addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 3) {
                document.getElementById('results').innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`/api/v1/geocode?query=${encodeURIComponent(query)}&limit=5`);
                const results = await response.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                if (results.length === 0) {
                    resultsDiv.innerHTML = '<div class="result-item">Keine Ergebnisse</div>';
                    return;
                }

                results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.textContent = result.label;
                    item.addEventListener('click', () => {
                        // Karte auf Ergebnis zentrieren
                        map.setView([result.lat, result.lon], 15);

                        // Marker setzen
                        markers.forEach(marker => map.removeLayer(marker));
                        markers = [];

                        const marker = L.marker([result.lat, result.lon]).addTo(map);
                        markers.push(marker);

                        marker.bindPopup(`
                            <b>${result.label}</b><br>
                            Lat: ${result.lat.toFixed(6)}<br>
                            Lon: ${result.lon.toFixed(6)}<br>
                            <a href="/api/v1/building-info?address=${encodeURIComponent(result.label)}" target="_blank">Gebäudeinfo</a>
                        `).openPopup();

                        // Suchfeld leeren
                        document.getElementById('search-input').value = '';
                        resultsDiv.innerHTML = '';
                    });
                    resultsDiv.appendChild(item);
                });
            } catch (error) {
                console.error('Suche fehlgeschlagen:', error);
                document.getElementById('results').innerHTML = '<div class="result-item">Fehler bei der Suche</div>';
            }
        });
    </script>
</body>
</html>
