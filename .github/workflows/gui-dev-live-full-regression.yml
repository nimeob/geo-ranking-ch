name: gui-dev-live-full-regression

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "UI-Base-URL für den Full-Regression-Lauf"
        required: false
        default: "https://www.dev.georanking.ch"
        type: string
      fallback_login_start_on_missing_creds:
        description: "Bei fehlenden Live-Secrets Login-Start-Fallback nutzen"
        required: false
        default: false
        type: boolean

concurrency:
  group: gui-dev-live-full-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-ui-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEV_UI_BASE_URL: ${{ inputs.base_url }}
      DEV_UI_SMOKE_RUN_ID: ${{ github.run_number }}-${{ github.run_attempt }}
      DEV_UI_SMOKE_WORKFLOW_NAME: gui-dev-live-full-regression
      DEV_UI_SMOKE_BLOCKER_PREFIX: dev-ui-full-regression-blocked
      DEV_UI_SMOKE_BLOCKER_DIR: artifacts/dev-ui-full/latest
      DEV_UI_SMOKE_USERNAME: ${{ secrets.DEV_UI_SMOKE_USERNAME }}
      DEV_UI_SMOKE_PASSWORD: ${{ secrets.DEV_UI_SMOKE_PASSWORD }}
      DEV_UI_FULL_EVIDENCE_JSON: artifacts/dev-ui-full/latest/dev-ui-full-regression.json
      DEV_UI_FULL_SCREENSHOT_DIR: artifacts/dev-ui-full/latest/screenshots

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        if: ${{ inputs.fallback_login_start_on_missing_creds != true }}
        run: ./scripts/smoke/validate_gui_live_auth_analyze_secrets.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run DEV live full UI regression
        shell: bash
        run: |
          set -euo pipefail
          cmd=(node scripts/run_dev_ui_live_full_regression.mjs --base-url "${{ inputs.base_url }}")

          if [[ "${{ inputs.fallback_login_start_on_missing_creds }}" == "true" ]]; then
            cmd+=(--fallback-login-start)
          fi

          printf 'Running command:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"

      - name: Upload full-regression artifacts
        id: upload_dev_full_regression_artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: gui-dev-live-full-regression-artifacts
          path: |
            artifacts/dev-ui-full/latest/**
          if-no-files-found: warn
          overwrite: true

      - name: Retry upload full-regression artifacts
        if: always() && steps.upload_dev_full_regression_artifacts.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: gui-dev-live-full-regression-artifacts
          path: |
            artifacts/dev-ui-full/latest/**
          if-no-files-found: warn
          overwrite: true
