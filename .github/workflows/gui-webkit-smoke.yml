name: gui-webkit-smoke

"on":
  pull_request:
  workflow_dispatch:

jobs:
  gui-webkit-smoke:
    name: gui-webkit-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright + native WebKit runtime deps
        run: |
          npm install
          npx playwright install --with-deps webkit

      - name: Start local GUI service
        run: |
          HOST=127.0.0.1 PORT=8877 APP_VERSION=dev python3 -m src.web_service >/tmp/gui-webkit-service.log 2>&1 &
          echo $! >/tmp/gui-webkit-service.pid

          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:8877/healthz" >/dev/null; then
              echo "GUI service is ready"
              break
            fi

            if ! kill -0 "$(cat /tmp/gui-webkit-service.pid)" 2>/dev/null; then
              echo "::error::GUI service exited before becoming ready"
              tail -n 200 /tmp/gui-webkit-service.log || true
              exit 1
            fi

            sleep 2
          done

          if ! curl -fsS "http://127.0.0.1:8877/healthz" >/dev/null; then
            echo "::error::GUI service failed to start on 127.0.0.1:8877"
            tail -n 200 /tmp/gui-webkit-service.log || true
            exit 1
          fi

      - name: Run native WebKit smoke
        env:
          REQUIRE_NATIVE_WEBKIT: "1"
        run: |
          BASE_URL="http://127.0.0.1:8877/gui" npm run smoke:gui:webkit | tee /tmp/issue-986-webkit-output.txt

      - name: Collect smoke artifacts
        run: |
          mkdir -p artifacts/gui-webkit-smoke

          SMOKE_JSON=$(tail -n1 /tmp/issue-986-webkit-output.txt | tr -d '\r')
          if [ -z "$SMOKE_JSON" ] || [ ! -f "$SMOKE_JSON" ]; then
            echo "::error::Smoke JSON path missing or not found: '$SMOKE_JSON'"
            exit 1
          fi

          cp "$SMOKE_JSON" artifacts/gui-webkit-smoke/

          SCREENSHOT_REL=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['artifacts']['screenshot'])" "$SMOKE_JSON")
          if [ -z "$SCREENSHOT_REL" ] || [ ! -f "$SCREENSHOT_REL" ]; then
            echo "::error::Screenshot path missing or not found: '$SCREENSHOT_REL'"
            exit 1
          fi
          cp "$SCREENSHOT_REL" artifacts/gui-webkit-smoke/

          cp /tmp/gui-webkit-service.log artifacts/gui-webkit-smoke/ || true

      - name: Upload native WebKit smoke artifact
        id: upload_webkit_smoke_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: gui-webkit-smoke-artifacts
          path: artifacts/gui-webkit-smoke
          if-no-files-found: error
          overwrite: true

      - name: Retry upload native WebKit smoke artifact
        if: always() && steps.upload_webkit_smoke_artifact.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: gui-webkit-smoke-artifacts
          path: artifacts/gui-webkit-smoke
          if-no-files-found: error
          overwrite: true

      - name: Stop local GUI service
        if: always()
        run: |
          if [ -f /tmp/gui-webkit-service.pid ]; then
            kill "$(cat /tmp/gui-webkit-service.pid)" 2>/dev/null || true
          fi
