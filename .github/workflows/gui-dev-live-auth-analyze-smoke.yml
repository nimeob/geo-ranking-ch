name: gui-dev-live-auth-analyze-smoke

on:
  workflow_dispatch:

concurrency:
  group: gui-dev-live-auth-analyze-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-ui-auth-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - gui_path: /gui
            path_slug: gui
            path_ordinal: 1
          - gui_path: /gui/history
            path_slug: gui-history
            path_ordinal: 2
          - gui_path: /gui/jobs
            path_slug: gui-jobs
            path_ordinal: 3
          - gui_path: /jobs
            path_slug: jobs
            path_ordinal: 4
          - gui_path: /gui/jobs/demo-job
            path_slug: gui-jobs-demo-job
            path_ordinal: 5
    env:
      BASE_URL: https://www.dev.georanking.ch
      DEV_UI_SMOKE_GUI_PATH: ${{ matrix.gui_path }}
      DEV_UI_SMOKE_RUN_ID: ${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.path_ordinal }}
      DEV_UI_SMOKE_USERNAME: ${{ secrets.DEV_UI_SMOKE_USERNAME }}
      DEV_UI_SMOKE_PASSWORD: ${{ secrets.DEV_UI_SMOKE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        run: ./scripts/smoke/validate_gui_live_auth_analyze_secrets.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run DEV live UI auth+analyze smoke (${{ matrix.gui_path }})
        run: node scripts/run_dev_ui_auth_analyze_smoke.mjs

      - name: Upload smoke artifacts
        id: upload_dev_auth_analyze_artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: gui-dev-live-auth-analyze-smoke-artifacts-${{ matrix.path_slug }}
          path: |
            reports/evidence/dev-ui-auth-analyze-smoke-*.json
            reports/evidence/dev-ui-auth-analyze-smoke-*.png
            reports/evidence/dev-ui-auth-analyze-smoke-blocked-*.json
          if-no-files-found: warn
          overwrite: true

      - name: Retry upload smoke artifacts
        if: always() && steps.upload_dev_auth_analyze_artifacts.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: gui-dev-live-auth-analyze-smoke-artifacts-${{ matrix.path_slug }}
          path: |
            reports/evidence/dev-ui-auth-analyze-smoke-*.json
            reports/evidence/dev-ui-auth-analyze-smoke-*.png
            reports/evidence/dev-ui-auth-analyze-smoke-blocked-*.json
          if-no-files-found: warn
          overwrite: true
