name: gui-dev-live-auth-analyze-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "UI-Base-URL für den Smoke-Lauf"
        required: false
        default: "https://www.dev.georanking.ch"
        type: string
      routes:
        description: "Optionales CSV-Subset (z. B. /gui,/jobs?source=smoke)"
        required: false
        default: ""
        type: string
      timeout_ms:
        description: "Optionales Timeout pro Route in Millisekunden"
        required: false
        default: ""
        type: string
      login_reason:
        description: "reason-Parameter für /login"
        required: false
        default: "manual_login"
        type: string
      fallback_login_start_on_preflight_fail:
        description: "Bei fehlenden Live-Secrets Login-Start-Fallback nutzen"
        required: false
        default: false
        type: boolean

concurrency:
  group: gui-dev-live-auth-analyze-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-ui-auth-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url }}
      DEV_UI_SMOKE_LOGIN_REASON: ${{ inputs.login_reason }}
      DEV_UI_SMOKE_USERNAME: ${{ secrets.DEV_UI_SMOKE_USERNAME }}
      DEV_UI_SMOKE_PASSWORD: ${{ secrets.DEV_UI_SMOKE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run DEV live UI auth+analyze smoke route set
        shell: bash
        run: |
          set -euo pipefail
          cmd=(./scripts/smoke/run_gui_live_auth_analyze_route_set.sh)

          if [[ -n "${{ inputs.routes }}" ]]; then
            cmd+=(--routes "${{ inputs.routes }}")
          fi

          if [[ -n "${{ inputs.timeout_ms }}" ]]; then
            cmd+=(--timeout-ms "${{ inputs.timeout_ms }}")
          fi

          if [[ "${{ inputs.fallback_login_start_on_preflight_fail }}" == "true" ]]; then
            cmd+=(--fallback-login-start-on-preflight-fail)
          fi

          printf 'Running command:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"

      - name: Upload smoke artifacts
        id: upload_dev_auth_analyze_artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: gui-dev-live-auth-analyze-smoke-artifacts
          path: |
            reports/evidence/dev-ui-auth-analyze-smoke-*.json
            reports/evidence/dev-ui-auth-analyze-smoke-*.png
            reports/evidence/dev-ui-auth-analyze-smoke-blocked-*.json
          if-no-files-found: warn
          overwrite: true

      - name: Retry upload smoke artifacts
        if: always() && steps.upload_dev_auth_analyze_artifacts.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: gui-dev-live-auth-analyze-smoke-artifacts
          path: |
            reports/evidence/dev-ui-auth-analyze-smoke-*.json
            reports/evidence/dev-ui-auth-analyze-smoke-*.png
            reports/evidence/dev-ui-auth-analyze-smoke-blocked-*.json
          if-no-files-found: warn
          overwrite: true
