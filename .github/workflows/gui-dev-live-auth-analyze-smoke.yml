name: gui-dev-live-auth-analyze-smoke

on:
  workflow_dispatch:

concurrency:
  group: gui-dev-live-auth-analyze-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-ui-auth-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.dev.georanking.ch
      DEV_UI_SMOKE_RUN_ID: ${{ github.run_number }}-${{ github.run_attempt }}
      DEV_UI_SMOKE_USERNAME: ${{ secrets.DEV_UI_SMOKE_USERNAME }}
      DEV_UI_SMOKE_PASSWORD: ${{ secrets.DEV_UI_SMOKE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: ./scripts/smoke/validate_gui_live_auth_analyze_secrets.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run DEV live UI full regression
        env:
          DEV_UI_BASE_URL: ${{ env.BASE_URL }}
          DEV_UI_FULL_EVIDENCE_JSON: artifacts/dev-ui-full/latest/dev-ui-full-regression.json
          DEV_UI_FULL_SCREENSHOT_DIR: artifacts/dev-ui-full/latest/screenshots
        run: node scripts/run_dev_ui_live_full_regression.mjs

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-dev-live-auth-analyze-smoke-artifacts
          path: |
            reports/evidence/dev-ui-auth-analyze-smoke-*.json
            reports/evidence/dev-ui-auth-analyze-smoke-*.png
            reports/evidence/dev-ui-auth-analyze-smoke-blocked-*.json
            artifacts/dev-ui-full/latest/**
          if-no-files-found: warn
