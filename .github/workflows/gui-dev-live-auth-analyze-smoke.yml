name: gui-dev-live-auth-analyze-smoke

on:
  workflow_dispatch:

concurrency:
  group: gui-dev-live-auth-analyze-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-ui-auth-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.dev.georanking.ch
      DEV_UI_SMOKE_RUN_ID: ${{ github.run_id }}
      DEV_UI_SMOKE_USERNAME: ${{ secrets.DEV_UI_SMOKE_USERNAME }}
      DEV_UI_SMOKE_PASSWORD: ${{ secrets.DEV_UI_SMOKE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${DEV_UI_SMOKE_USERNAME:-}" ] || [ -z "${DEV_UI_SMOKE_PASSWORD:-}" ]; then
            echo "::error::Missing required secrets DEV_UI_SMOKE_USERNAME / DEV_UI_SMOKE_PASSWORD for real UI login smoke."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run DEV live UI auth+analyze smoke
        run: node scripts/run_dev_ui_auth_analyze_smoke.mjs

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-dev-live-auth-analyze-smoke-artifacts
          path: |
            reports/evidence/dev-ui-auth-analyze-smoke-*.json
            reports/evidence/dev-ui-auth-analyze-smoke-*.png
          if-no-files-found: warn
