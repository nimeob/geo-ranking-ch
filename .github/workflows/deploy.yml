name: Deploy to AWS (ECS dev)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: deploy-ecs-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Preflight boundary guard (fail-fast)
        run: python3 scripts/check_bl31_service_boundaries.py --src-dir src

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  deploy-ecs-full-env:
    name: Deploy full ECS environment (dev)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required deploy environment keys (vars + secrets)
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          ECS_UI_SERVICE: ${{ vars.ECS_UI_SERVICE }}
          ECS_API_CONTAINER_NAME: ${{ vars.ECS_API_CONTAINER_NAME }}
          ECS_UI_CONTAINER_NAME: ${{ vars.ECS_UI_CONTAINER_NAME }}
          ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          ECR_UI_REPOSITORY: ${{ vars.ECR_UI_REPOSITORY }}
          SERVICE_API_BASE_URL: ${{ vars.SERVICE_API_BASE_URL }}
          SERVICE_HEALTH_URL: ${{ vars.SERVICE_HEALTH_URL }}
          SERVICE_APP_BASE_URL: ${{ vars.SERVICE_APP_BASE_URL }}
          SERVICE_API_AUTH_TOKEN: ${{ secrets.SERVICE_API_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/validate_required_deploy_env.py

      - name: Configure AWS credentials (OIDC)
        env:
          AWS_ROLE_TO_ASSUME: arn:aws:iam::523234426229:role/swisstopo-dev-github-deploy-role
        run: |
          set -euo pipefail

          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          if [[ "$OIDC_URL" == *"?"* ]]; then
            OIDC_URL="${OIDC_URL}&audience=sts.amazonaws.com"
          else
            OIDC_URL="${OIDC_URL}?audience=sts.amazonaws.com"
          fi

          OIDC_TOKEN=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$OIDC_URL" \
            | jq -r '.value')

          if [ -z "${OIDC_TOKEN}" ] || [ "${OIDC_TOKEN}" = "null" ]; then
            echo "::error::OIDC token request failed (empty token)."
            exit 1
          fi

          SESSION_NAME="gha-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CREDENTIALS_JSON=$(aws sts assume-role-with-web-identity \
            --role-arn "${AWS_ROLE_TO_ASSUME}" \
            --role-session-name "${SESSION_NAME}" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600)

          AWS_ACCESS_KEY_ID=$(echo "$CREDENTIALS_JSON" | jq -r '.Credentials.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(echo "$CREDENTIALS_JSON" | jq -r '.Credentials.SecretAccessKey')
          AWS_SESSION_TOKEN=$(echo "$CREDENTIALS_JSON" | jq -r '.Credentials.SessionToken')

          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ "${AWS_ACCESS_KEY_ID}" = "null" ]; then
            echo "::error::Failed to assume OIDC role: AccessKeyId missing."
            exit 1
          fi

          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"

          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
          } >> "$GITHUB_ENV"

          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        run: |
          set -euo pipefail
          [ -n "${AWS_ACCOUNT_ID:-}" ]
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and push API/UI images
        id: images
        env:
          ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          ECR_UI_REPOSITORY: ${{ vars.ECR_UI_REPOSITORY }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::7}"
          [ -n "${AWS_ACCOUNT_ID:-}" ]
          API_IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_API_REPOSITORY}:${IMAGE_TAG}"
          UI_IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_UI_REPOSITORY}:${IMAGE_TAG}"

          rm -f .dockerignore
          export DOCKER_BUILDKIT=0

          retry_cmd() {
            local max_attempts="$1"
            shift
            local sleep_seconds="$1"
            shift

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              local rc=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Command failed after ${attempt} attempts (rc=${rc}): $*"
                return "$rc"
              fi
              echo "::warning::Attempt ${attempt}/${max_attempts} failed (rc=${rc}); retrying in ${sleep_seconds}s: $*"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }

          BASE_IMAGE="public.ecr.aws/docker/library/python:3.12-slim"
          retry_cmd 5 20 docker pull "${BASE_IMAGE}"

          retry_cmd 3 30 docker build --no-cache --pull=false -t "${API_IMAGE_URI}" .
          retry_cmd 3 20 docker push "${API_IMAGE_URI}"

          retry_cmd 3 30 docker build --no-cache --pull=false -f Dockerfile.ui --build-arg APP_VERSION="${IMAGE_TAG}" -t "${UI_IMAGE_URI}" .
          retry_cmd 3 20 docker push "${UI_IMAGE_URI}"

          echo "api_image_uri=${API_IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "ui_image_uri=${UI_IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Register new task definitions (API + UI)
        id: taskdefs
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          ECS_UI_SERVICE: ${{ vars.ECS_UI_SERVICE }}
          ECS_API_CONTAINER_NAME: ${{ vars.ECS_API_CONTAINER_NAME }}
          ECS_UI_CONTAINER_NAME: ${{ vars.ECS_UI_CONTAINER_NAME }}
          API_IMAGE_URI: ${{ steps.images.outputs.api_image_uri }}
          UI_IMAGE_URI: ${{ steps.images.outputs.ui_image_uri }}
          UI_CANONICAL_ORIGIN: ${{ vars.UI_CANONICAL_ORIGIN }}
          UI_CANONICAL_HOSTS: ${{ vars.UI_CANONICAL_HOSTS }}
        run: |
          set -euo pipefail

          register_taskdef () {
            local service="$1"
            local container="$2"
            local image="$3"
            local outvar="$4"
            local canonical_origin="$5"
            local canonical_hosts="$6"

            local current_taskdef_arn
            current_taskdef_arn=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].taskDefinition' \
              --output text)

            aws ecs describe-task-definition \
              --task-definition "$current_taskdef_arn" \
              --query 'taskDefinition' > taskdef.json

            jq \
              --arg CONTAINER "$container" \
              --arg IMAGE "$image" \
              --arg APP_VERSION "${GITHUB_SHA::7}" \
              --arg GIT_SHA "${GITHUB_SHA}" \
              --arg UI_CANONICAL_ORIGIN "$canonical_origin" \
              --arg UI_CANONICAL_HOSTS "$canonical_hosts" '
              del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
              | .containerDefinitions = (
                  .containerDefinitions
                  | map(
                      if .name == $CONTAINER then
                        .image = $IMAGE
                        | .environment = ((.environment // [])
                          | map(select(
                              .name != "APP_VERSION"
                              and .name != "GIT_SHA"
                              and .name != "UI_CANONICAL_ORIGIN"
                              and .name != "UI_CANONICAL_HOSTS"
                            ))
                          + [
                              {"name":"APP_VERSION","value":$APP_VERSION},
                              {"name":"GIT_SHA","value":$GIT_SHA}
                            ]
                          + (if ($UI_CANONICAL_ORIGIN | length) > 0 then
                               [{"name":"UI_CANONICAL_ORIGIN","value":$UI_CANONICAL_ORIGIN}]
                             else
                               []
                             end)
                          + (if ($UI_CANONICAL_HOSTS | length) > 0 then
                               [{"name":"UI_CANONICAL_HOSTS","value":$UI_CANONICAL_HOSTS}]
                             else
                               []
                             end))
                      else
                        .
                      end
                    )
                )
            ' taskdef.json > taskdef-new.json

            local new_taskdef_arn
            new_taskdef_arn=$(aws ecs register-task-definition \
              --cli-input-json file://taskdef-new.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            echo "${outvar}=${new_taskdef_arn}" >> "$GITHUB_OUTPUT"
          }

          register_taskdef "$ECS_API_SERVICE" "$ECS_API_CONTAINER_NAME" "$API_IMAGE_URI" "api_task_def_arn" "" ""
          register_taskdef "$ECS_UI_SERVICE" "$ECS_UI_CONTAINER_NAME" "$UI_IMAGE_URI" "ui_task_def_arn" "${UI_CANONICAL_ORIGIN:-}" "${UI_CANONICAL_HOSTS:-}"

      - name: Deploy API service and wait for stability
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          API_TASK_DEF_ARN: ${{ steps.taskdefs.outputs.api_task_def_arn }}
          ECS_STABILITY_TIMEOUT_SECONDS: ${{ vars.ECS_STABILITY_TIMEOUT_SECONDS }}
        run: |
          set -euo pipefail

          wait_for_service_stability() {
            local service_name="$1"
            local timeout_seconds="${ECS_STABILITY_TIMEOUT_SECONDS:-900}"

            set +e
            timeout "${timeout_seconds}" aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$service_name"
            local wait_rc=$?
            set -e

            if [[ "$wait_rc" -eq 0 ]]; then
              return 0
            fi

            if [[ "$wait_rc" -eq 124 ]]; then
              echo "::error::ECS wait timed out after ${timeout_seconds}s for service '${service_name}'."
            else
              echo "::error::ECS wait failed for service '${service_name}' (exit ${wait_rc})."
            fi

            echo "::group::ECS service diagnostics (${service_name})"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service_name" \
              --query 'services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,taskDefinition:taskDefinition,deployments:deployments[].{status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,desiredCount:desiredCount,pendingCount:pendingCount,runningCount:runningCount,failedTasks:failedTasks},events:events[0:10].[createdAt,message]}' \
              --output json || true
            echo "::endgroup::"

            return "$wait_rc"
          }

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --task-definition "$API_TASK_DEF_ARN" \
            --force-new-deployment

          wait_for_service_stability "$ECS_API_SERVICE"

      - name: Smoke-Test API /health
        env:
          SERVICE_API_BASE_URL: ${{ vars.SERVICE_API_BASE_URL }}
          SERVICE_HEALTH_URL: ${{ vars.SERVICE_HEALTH_URL }}
        run: |
          set -euo pipefail
          API_HEALTH_URL="${SERVICE_HEALTH_URL:-}"
          if [ -z "$API_HEALTH_URL" ] && [ -n "${SERVICE_API_BASE_URL:-}" ]; then
            API_HEALTH_URL="${SERVICE_API_BASE_URL%/}/health"
          fi
          [ -n "$API_HEALTH_URL" ]

          HTTP_CODE=$(curl -sS -L --max-time 15 --retry 5 --retry-delay 5 --retry-connrefused -o /tmp/smoke-api-health-response.txt -w "%{http_code}" "$API_HEALTH_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::API smoke failed: ${API_HEALTH_URL} returned HTTP ${HTTP_CODE}"
            head -c 1000 /tmp/smoke-api-health-response.txt || true
            exit 1
          fi

      - name: Deploy UI service and wait for stability
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_UI_SERVICE: ${{ vars.ECS_UI_SERVICE }}
          UI_TASK_DEF_ARN: ${{ steps.taskdefs.outputs.ui_task_def_arn }}
          ECS_STABILITY_TIMEOUT_SECONDS: ${{ vars.ECS_STABILITY_TIMEOUT_SECONDS }}
        run: |
          set -euo pipefail

          wait_for_service_stability() {
            local service_name="$1"
            local timeout_seconds="${ECS_STABILITY_TIMEOUT_SECONDS:-900}"

            set +e
            timeout "${timeout_seconds}" aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$service_name"
            local wait_rc=$?
            set -e

            if [[ "$wait_rc" -eq 0 ]]; then
              return 0
            fi

            if [[ "$wait_rc" -eq 124 ]]; then
              echo "::error::ECS wait timed out after ${timeout_seconds}s for service '${service_name}'."
            else
              echo "::error::ECS wait failed for service '${service_name}' (exit ${wait_rc})."
            fi

            echo "::group::ECS service diagnostics (${service_name})"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service_name" \
              --query 'services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,taskDefinition:taskDefinition,deployments:deployments[].{status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,desiredCount:desiredCount,pendingCount:pendingCount,runningCount:runningCount,failedTasks:failedTasks},events:events[0:10].[createdAt,message]}' \
              --output json || true
            echo "::endgroup::"

            return "$wait_rc"
          }

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_UI_SERVICE" \
            --task-definition "$UI_TASK_DEF_ARN" \
            --force-new-deployment

          wait_for_service_stability "$ECS_UI_SERVICE"

      - name: Smoke-Test UI /healthz
        env:
          SERVICE_APP_BASE_URL: ${{ vars.SERVICE_APP_BASE_URL }}
        run: |
          set -euo pipefail
          [ -n "${SERVICE_APP_BASE_URL:-}" ]
          UI_HEALTH_URL="${SERVICE_APP_BASE_URL%/}/healthz"
          HTTP_CODE=$(curl -sS -L --max-time 15 --retry 5 --retry-delay 5 --retry-connrefused -o /tmp/smoke-ui-health-response.txt -w "%{http_code}" "$UI_HEALTH_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::UI smoke failed: ${UI_HEALTH_URL} returned HTTP ${HTTP_CODE}"
            head -c 1000 /tmp/smoke-ui-health-response.txt || true
            exit 1
          fi

      - name: Smoke-Test UI canonical-host redirect route matrix (/login?start=1 on alias host)
        env:
          SERVICE_APP_BASE_URL: ${{ vars.SERVICE_APP_BASE_URL }}
          UI_CANONICAL_ORIGIN: ${{ vars.UI_CANONICAL_ORIGIN }}
          UI_CANONICAL_HOSTS: ${{ vars.UI_CANONICAL_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "${SERVICE_APP_BASE_URL:-}" ]

          scripts/smoke/run_canonical_redirect_smoke_bundle.sh \
            --base-url "${SERVICE_APP_BASE_URL}" \
            --env-name "dev" \
            --canonical-origin "${UI_CANONICAL_ORIGIN:-}" \
            --canonical-hosts "${UI_CANONICAL_HOSTS:-}" \
            --reason "manual_login" \
            --timeout 20 \
            --max-attempts 8 \
            --retry-delay 5 \
            --output-dir "artifacts"

      - name: Reconcile DEV ALB listener login-entry rules
        env:
          DEV_ALB_NAME: ${{ vars.DEV_ALB_NAME }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/reconcile_dev_alb_listener_rules.py \
            --lb-name "${DEV_ALB_NAME:-swisstopo-dev-vpc-alb}" \
            --region "${AWS_REGION}" \
            --apply \
            --output-json artifacts/dev-alb-listener-reconcile.json
          RECONCILE_RC=$?
          set -e

          if [ "$RECONCILE_RC" -eq 3 ]; then
            echo "::warning::DEV ALB reconcile skipped (AWS access denied for deploy role). Remediation: update swisstopo-dev-github-deploy-policy from infra/iam/deploy-policy.json (see docs/DEV_ALB_LISTENER_RULES.md, section 'CI-Remediation bei aws_access_denied'). Artifact: artifacts/dev-alb-listener-reconcile.json"
          elif [ "$RECONCILE_RC" -ne 0 ]; then
            exit "$RECONCILE_RC"
          fi

      - name: Smoke-Test UI login start redirects to IdP authorize (/ + /gui + /gui/history + legacy /history + /jobs + /jobs/:id + /results/:id + legacy /gui/results/:id + legacy /gui/jobs*)
        env:
          SERVICE_APP_BASE_URL: ${{ vars.SERVICE_APP_BASE_URL }}
        run: |
          set -euo pipefail
          [ -n "${SERVICE_APP_BASE_URL:-}" ]

          scripts/smoke/run_login_start_smoke_bundle.sh \
            --base-url "${SERVICE_APP_BASE_URL}" \
            --env-name "dev" \
            --output-dir "artifacts"

      - name: Smoke-Test UI login start route matrix on alias host (dev.geo-ranking.ch)
        env:
          SERVICE_APP_BASE_URL: ${{ vars.SERVICE_APP_BASE_URL }}
          UI_CANONICAL_ORIGIN: ${{ vars.UI_CANONICAL_ORIGIN }}
          UI_CANONICAL_HOSTS: ${{ vars.UI_CANONICAL_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "${SERVICE_APP_BASE_URL:-}" ]

          ALIAS_BASE_URL="$(python3 scripts/smoke/infer_geo_alias_base_url.py \
            --service-app-base-url "${SERVICE_APP_BASE_URL}" \
            --canonical-origin "${UI_CANONICAL_ORIGIN:-}" \
            --canonical-hosts "${UI_CANONICAL_HOSTS:-}" \
            --require-tls-hostname-match \
            --probe-timeout 5)"

          if [ -z "${ALIAS_BASE_URL:-}" ]; then
            echo "::notice::No TLS-valid alias host could be inferred from SERVICE_APP_BASE_URL/UI_CANONICAL_*; skipping alias route-matrix smoke."
            exit 0
          fi

          scripts/smoke/run_login_start_smoke_bundle.sh \
            --base-url "${ALIAS_BASE_URL}" \
            --env-name "dev-alias" \
            --preserve-requested-base-url \
            --output-dir "artifacts"

      - name: Smoke-Test API auth proxy forwarded-host guard (/auth/login|logout|callback)
        env:
          SERVICE_API_BASE_URL: ${{ vars.SERVICE_API_BASE_URL }}
          SERVICE_APP_BASE_URL: ${{ vars.SERVICE_APP_BASE_URL }}
        run: |
          set -euo pipefail
          [ -n "${SERVICE_API_BASE_URL:-}" ]
          [ -n "${SERVICE_APP_BASE_URL:-}" ]

          python3 scripts/smoke/check_bff_auth_proxy_guard.py \
            --api-base-url "${SERVICE_API_BASE_URL}" \
            --ui-base-url "${SERVICE_APP_BASE_URL}" \
            --output-json artifacts/dev-auth-proxy-guard-smoke.json

      - name: Upload login-start smoke artifacts (dev)
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: dev-login-start-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            artifacts/dev-login-start-smoke*.json
            artifacts/dev-alias-login-start-smoke*.json
            artifacts/dev-canonical-host-redirect-smoke*.json
            artifacts/dev-auth-proxy-guard-smoke.json

      - name: Deployment summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ECS Deploy (dev)
          - Cluster: `${{ vars.ECS_CLUSTER }}`
          - API Service: `${{ vars.ECS_API_SERVICE }}`
          - UI Service: `${{ vars.ECS_UI_SERVICE }}`
          - API Image: `${{ steps.images.outputs.api_image_uri }}`
          - UI Image: `${{ steps.images.outputs.ui_image_uri }}`
          - API TaskDef: `${{ steps.taskdefs.outputs.api_task_def_arn }}`
          - UI TaskDef: `${{ steps.taskdefs.outputs.ui_task_def_arn }}`
          EOF

  open-or-update-failure-issue:
    name: Open/Update deployment failure issue
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-ecs-full-env]
    if: ${{ failure() }}
    steps:
      - name: Open or update issue for failed deploy
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'CI: stündlicher Dev-Deploy fehlgeschlagen';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const bodyAppend = [
              `Neuer fehlgeschlagener Lauf: ${runUrl}`,
              '',
              `- Workflow: ${context.workflow}`,
              `- Event: ${context.eventName}`,
              `- Branch/Ref: ${context.ref}`,
              `- SHA: ${context.sha}`,
              `- UTC: ${new Date().toISOString()}`,
              '',
              'Bitte Root-Cause analysieren und fixen, dann Redeploy triggern.'
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const match = existing.find((i) => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: match.number,
                body: bodyAppend,
              });
              core.info(`Updated existing issue #${match.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  'Der automatische Dev-Deploy ist fehlgeschlagen.',
                  '',
                  bodyAppend,
                  '',
                  '## DoD',
                  '- [ ] Fehlerursache identifiziert',
                  '- [ ] Fix auf `main`',
                  '- [ ] Redeploy grün',
                ].join('\n'),
              });
              core.info(`Created issue #${issue.number}`);
            }
