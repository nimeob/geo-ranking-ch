name: Security and Test Coverage

on:
  push:
    branches: [ main, feature/fastapi-refactor ]
  pull_request:
    branches: [ main, feature/fastapi-refactor ]

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov pytest-mock requests-mock

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety pip-audit

      - name: Run Bandit (Security Linter)
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      - name: Run Safety (Dependency Vulnerabilities)
        run: |
          safety check --json --output safety-report.json || true

      - name: Run pip-audit (Dependency Vulnerabilities)
        run: |
          pip-audit --format json --output pip-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json

  lint:
    name: Linting and Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff (Linting)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${BASE_REF}" || true
            mapfile -t CHANGED_PY_FILES < <(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- src tests | grep -E '\.py$' || true)

            if [[ ${#CHANGED_PY_FILES[@]} -eq 0 ]]; then
              echo "No changed Python files under src/ or tests/; skipping ruff."
              exit 0
            fi

            echo "Ruff target files (PR diff):"
            printf ' - %s\n' "${CHANGED_PY_FILES[@]}"
            ruff check "${CHANGED_PY_FILES[@]}"
          else
            ruff check src/ tests/
          fi

      - name: Run mypy (Type Checking)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${BASE_REF}" || true
            mapfile -t CHANGED_SRC_PY_FILES < <(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- src | grep -E '\.py$' || true)

            if [[ ${#CHANGED_SRC_PY_FILES[@]} -eq 0 ]]; then
              echo "No changed Python files under src/; skipping mypy."
              exit 0
            fi

            echo "mypy target files (PR diff):"
            printf ' - %s\n' "${CHANGED_SRC_PY_FILES[@]}"
            mypy --ignore-missing-imports --disallow-untyped-defs "${CHANGED_SRC_PY_FILES[@]}"
          else
            mypy src/ --ignore-missing-imports --disallow-untyped-defs
          fi
